# Upper bounds for the release image, from the first full build
# (2026-11-21: 440 packages, 838 MB installed, Files' ffmpeg is 367 MB of
# it). Lower them as the image shrinks; never raise without a reason.
# 2026-11-22: +7 for the hotspot (iw, dnsmasq-base, nftables and four
# netfilter libraries). nftables is the M2 firewall's too.
# 2026-11-22: +1 for gh0st-wifi (the Wi-Fi chip's boot retry and about
# 2 MB of USB adapter firmware).
# 2026-11-23: +2 for curl and wget. The AppStore and the apps it installs
# download with them; their libraries were already in.
MAX_PACKAGES=454
MAX_INSTALLED_MB=850
