# Privacy defaults (docs/image-build.md, Privacy). The MAC addresses are
# set here only; a network's own choice is in its profile. Settings writes
# the device name and IPv6 privacy to /etc/NetworkManager/conf.d, which
# overrides these.
[connectivity]
enabled=false

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable-ssid
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
ipv6.addr-gen-mode=stable-privacy

# A USB Ethernet adapter with no address of its own (cheap r8152 ones) gets
# a random one at every plug, and with it a new name and a new default
# profile. One stable id for every wired link keeps the generated address,
# and so the DHCP lease, the same across plugs and boots.
[connection-gh0st-wired]
match-device=type:ethernet
connection.stable-id=gh0st-wired
