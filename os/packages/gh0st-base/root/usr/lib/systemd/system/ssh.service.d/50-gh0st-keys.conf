# The image ships no host keys: each device makes its own the first time
# SSH starts. ssh-keygen -A only creates the missing ones. Debian's
# sshd-keygen.service runs only on systemd's first boot, which an image
# with an empty machine-id never has.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
