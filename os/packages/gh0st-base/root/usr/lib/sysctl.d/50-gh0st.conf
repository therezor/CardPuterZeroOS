kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.core_pattern = |/bin/false
kernel.printk = 3 4 1 3
# Raspberry Pi OS values: headroom for USB and Wi-Fi atomic allocations,
# and unprivileged ping.
vm.min_free_kbytes = 16384
net.ipv4.ping_group_range = 0 2147483647
# Swap is zram only: compressed RAM, so read one page at a time and swap
# freely instead of dropping page cache.
vm.page-cluster = 0
vm.swappiness = 100
