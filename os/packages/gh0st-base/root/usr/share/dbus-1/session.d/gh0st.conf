<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Every app runs as the same user, so a sandboxed one could reach out of
     its sandbox over the session bus (docs/isolation.md). systemctl and
     systemd-run use systemd's private socket, which no sandbox sees; with
     wait, pipe or pty systemd-run takes the bus and is refused too.
     Never deny eavesdrop on its own: a bare rule matches every message and
     cuts each new client off the bus. -->
<busconfig>
  <policy context="default">
    <!-- A transient unit runs outside any sandbox. -->
    <deny send_destination="org.freedesktop.systemd1"/>
    <!-- LD_PRELOAD for every service started after. -->
    <deny send_destination="org.freedesktop.DBus"
          send_interface="org.freedesktop.DBus"
          send_member="UpdateActivationEnvironment"/>
    <!-- Reading every app's messages, the keyring's replies included. -->
    <deny send_destination="org.freedesktop.DBus"
          send_interface="org.freedesktop.DBus.Monitoring"
          send_member="BecomeMonitor"/>
    <deny receive_type="method_call" eavesdrop="true"/>
    <deny receive_type="method_return" eavesdrop="true"/>
    <deny receive_type="error" eavesdrop="true"/>
    <deny receive_type="signal" eavesdrop="true"/>
  </policy>
</busconfig>
