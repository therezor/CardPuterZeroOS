# Camera apps use libcamera directly, and nothing plays MIDI. Without
# these monitors PipeWire keeps no node for each of the camera stack's
# video devices: 1.7 MB less, measured on the device.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    monitor.alsa-midi = disabled
  }
}
