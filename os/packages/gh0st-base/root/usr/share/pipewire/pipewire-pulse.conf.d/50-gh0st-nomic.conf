# A second pulse socket for apps the user took the microphone from: the
# sandbox binds it at pulse/native, and gh0st-nomic.lua hides sources
# from its clients. A drop-in replaces server.address, so the usual
# socket is listed again.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:native-nomic" client.access = "gh0st-nomic" }
    ]
}
