# Privacy defaults (docs/distro-plan.md, section 7). Settings writes its
# choices to /etc/NetworkManager/conf.d, which overrides these.
[main]
# A cable stays offline until the user picks it: nothing goes online
# before setup's network step.
no-auto-default=*

[connectivity]
enabled=false

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable-ssid
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
ipv6.addr-gen-mode=stable-privacy
