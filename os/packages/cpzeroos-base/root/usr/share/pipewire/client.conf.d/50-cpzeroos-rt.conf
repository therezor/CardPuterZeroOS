# Realtime audio threads without rtkit (not installed: its daemon wakes at
# idle). PipeWire sets the priority itself, within the limits that
# user@.service grants (50-cpzeroos-audio.conf). Same values as stock.
module.rt.args = {
    nice.level = -11
    rt.prio = 20
    rtportal.enabled = false
    rtkit.enabled = false
}
