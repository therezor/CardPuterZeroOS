[workspace]
resolver = "3"
members = ["crates/zer0", "crates/zer0-core", "crates/zer0-ui", "crates/zer0-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Zer0, a lean shell for the M5Stack CardputerZero"

[workspace.dependencies]
zer0-core = { path = "crates/zer0-core" }
zer0-ui = { path = "crates/zer0-ui" }
zer0-shell = { path = "crates/zer0-shell" }
libc = "0.2"

# A 512 MB board: small text, no unwinding tables, stripped.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Mockups and tests draw a lot of pixels; keep them quick in debug builds.
[profile.dev.package."*"]
opt-level = 2
