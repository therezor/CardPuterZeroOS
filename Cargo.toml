[workspace]
resolver = "3"
members = [
    "crates/gh0st",
    "crates/gh0st-core",
    "crates/gh0st-dbus",
    "crates/gh0st-keyringd",
    "crates/gh0st-keyring",
    "crates/gh0st-session",
    "crates/gh0st-ui",
    "crates/gh0st-shell",
    "crates/gh0st-app",
    "crates/gh0st-settings",
    "crates/gh0st-term",
    "crates/gh0st-update",
    "crates/gh0st-store",
    "crates/gh0st-camera",
    "crates/gh0st-files",
    "crates/gh0st-text",
    "crates/gh0st-media",
    "crates/gh0st-keyboard",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/therezor/CardPuterZeroOS"
description = "The Gh0st OS shell for the M5Stack CardputerZero"

[workspace.dependencies]
gh0st-core = { path = "crates/gh0st-core" }
gh0st-ui = { path = "crates/gh0st-ui" }
gh0st-shell = { path = "crates/gh0st-shell" }
gh0st-app = { path = "crates/gh0st-app" }
gh0st-dbus = { path = "crates/gh0st-dbus" }
libc = "0.2"
gh0st-keyringd = { path = "crates/gh0st-keyringd" }
gh0st-session = { path = "crates/gh0st-session" }
# The keyring's crypto: audited RustCrypto crates, never our own.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.8"

# A 512 MB board: small text, no unwinding tables, stripped.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Mockups and tests draw a lot of pixels; keep them quick in debug builds.
[profile.dev.package."*"]
opt-level = 2
