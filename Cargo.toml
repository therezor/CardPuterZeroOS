[workspace]
resolver = "3"
members = [
    "crates/gh0st",
    "crates/gh0st-core",
    "crates/gh0st-ui",
    "crates/gh0st-shell",
    "crates/gh0st-app",
    "crates/gh0st-settings",
    "crates/gh0st-term",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/therezor/CardPuterZeroOS"
description = "Gh0stdeck, a lean shell for the M5Stack CardputerZero"

[workspace.dependencies]
gh0st-core = { path = "crates/gh0st-core" }
gh0st-ui = { path = "crates/gh0st-ui" }
gh0st-shell = { path = "crates/gh0st-shell" }
gh0st-app = { path = "crates/gh0st-app" }
libc = "0.2"

# A 512 MB board: small text, no unwinding tables, stripped.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Mockups and tests draw a lot of pixels; keep them quick in debug builds.
[profile.dev.package."*"]
opt-level = 2
