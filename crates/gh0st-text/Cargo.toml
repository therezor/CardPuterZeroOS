[package]
name = "gh0st-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Text: a code and text editor for the CardputerZero, a gh0st app"

[[bin]]
name = "gh0st-text"
path = "src/main.rs"

[dependencies]
gh0st-app.workspace = true
gh0st-core.workspace = true
libc.workspace = true
# wcwidth, as the terminal uses it: CJK and emoji take two cells.
unicode-width = "0.2"

# The mockups double as fixtures: `cargo test` draws every scene under the
# design lint.
[[example]]
name = "mockups"
test = true
