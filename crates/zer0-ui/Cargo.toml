[package]
name = "zer0-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["cjk"]
# Runtime outline fallback for glyphs the baked fonts lack (CJK and others).
cjk = ["dep:ab_glyph"]

[dependencies]
libc.workspace = true
png = "0.17"
ab_glyph = { version = "0.2", optional = true }

[build-dependencies]
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
