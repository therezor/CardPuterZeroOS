# The gate every change passes: format, clippy, every test (the sim runs
# included) and the static device build. On the same arm64 runner as the
# image, so the musl build is native.
name: ci

on:
  push:
    branches: [main]
    paths: [crates/**, assets/**, docs/**, os/store/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/**, .github/workflows/ci.yml]
  pull_request:
    paths: [crates/**, assets/**, docs/**, os/store/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/**, .github/workflows/ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the channel, target and components.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Store's signature test checks a real signature with sqv.
      - name: Signature tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sqv
      - name: Test
        run: cargo test --workspace
      - name: Store mirror
        run: python3 -m unittest discover -s os/store
      - name: Device build
        run: cargo build --release --target aarch64-unknown-linux-musl
