# The gate every change passes: format, clippy, every test (the sim runs
# included) and the static device build. On the same arm64 runner as the
# image, so the musl build is native.
name: ci

on:
  push:
    branches: [main, dev]
    paths: [crates/**, assets/**, docs/**, os/store/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/**, .github/workflows/ci.yml]
  pull_request:
    paths: [crates/**, assets/**, docs/**, os/store/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/**, .github/workflows/ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the channel, target and components.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Store's signature test checks a real signature with sqv. The
      # sandbox test runs bwrap, which Ubuntu's AppArmor stops from making
      # user namespaces unless told otherwise.
      - name: Signature and sandbox tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sqv bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: cargo test --workspace
      - name: Store mirror
        run: python3 -m unittest discover -s os/store
      - name: Device build
        run: cargo build --release --target aarch64-unknown-linux-musl

  # Real clients against our session services on a private bus: libsecret,
  # python keyring and secretstorage, git's libsecret helper, notify-send.
  compat:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compat-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: compat-${{ runner.os }}-
      - name: Clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus dbus-bin libsecret-tools \
            python3-keyring python3-secretstorage python3-gi gir1.2-glib-2.0 libglib2.0-bin libnotify-bin libsecret-1-dev libglib2.0-dev pkg-config
          sudo gcc -O2 -o /usr/lib/git-core/git-credential-libsecret \
            /usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret.c \
            $(pkg-config --cflags --libs libsecret-1 glib-2.0)
      - name: Build
        run: cargo build -p gh0st -p gh0st-files -p gh0st-settings
      - name: Keyring
        run: GH0ST=target/debug/gh0st dbus-run-session -- crates/gh0st-keyringd/tests/compat.sh
      - name: Session
        run: GH0ST=target/debug/gh0st GH0ST_FILES=target/debug/gh0st-files GH0ST_SETTINGS=target/debug/gh0st-settings dbus-run-session -- crates/gh0st-session/tests/compat.sh
      # The shell under --sim with both daemons: unlock, approve, deny, an
      # app in front parked and brought back, the dark, a portal open.
      - name: Shell and keyring
        run: GH0ST=target/debug/gh0st dbus-run-session -- crates/gh0st/tests/keyring_sim.sh
