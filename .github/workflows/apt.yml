# Publishes our apt repo to GitHub Pages (docs/updates.md, Our apt repo),
# and the Store's catalog beside it (docs/store.md): Pages deploys one
# artifact, so every run carries both. A push to main publishes edge, a v*
# tag publishes stable, and a daily run signs both suites again, so
# Valid-Until never lapses, and picks up M5's new apps. One pool for both suites:
# a file in it is never replaced, so a tag republishes what edge built.
name: apt

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [crates/**, assets/**, packaging/**, os/**, Cargo.toml, Cargo.lock, .github/workflows/apt.yml]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: edge, stable or resign
        default: edge
      fresh:
        description: edge only, before any stable release. Start from an empty site
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  # deploy-pages lists the run's artifacts.
  actions: read

# One publish at a time: each starts from the live site.
concurrency:
  group: apt-pages
  cancel-in-progress: false

env:
  SITE: https://therezor.github.io/CardPuterZeroOS/apt

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The package versions come from each package's last change.
          fetch-depth: 0
      - name: What to publish
        id: what
        run: |
          case "${{ github.event_name }}:${{ github.ref_type }}" in
            schedule:*) what=resign ;;
            workflow_dispatch:*) what="${{ inputs.what }}" ;;
            push:tag) what=stable ;;
            *) what=edge ;;
          esac
          echo "what=$what" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned inputs
        if: steps.what.outputs.what != 'resign'
        run: os/build.sh fetch
      - name: Build packages
        if: steps.what.outputs.what != 'resign'
        run: os/build.sh debs
      # The pool from the last run, so only new debs come down from Pages.
      - uses: actions/cache/restore@v4
        with:
          path: os/out/pages/apt/pool
          key: apt-pool-${{ github.run_id }}
          restore-keys: apt-pool-
      - name: Publish
        env:
          # Fresh: no live site to start from. Edge holds only this build and
          # stable starts empty, so it is for edge before any stable release.
          REPO_PREV: ${{ !(inputs.fresh && inputs.what == 'edge') && env.SITE || '' }}
          REPO_KEY: ${{ secrets.APT_SIGNING_KEY }}
          FRESH: ${{ inputs.fresh && 'yes' || '' }}
        run: |
          [ -n "$REPO_KEY" ] || { echo "set the APT_SIGNING_KEY secret (os/repo/README.md)"; exit 1; }
          if [ -n "$FRESH" ]; then
            [ "${{ steps.what.outputs.what }}" = edge ] || { echo "fresh is for edge only"; exit 1; }
            # A fresh run would empty a released stable suite.
            n=$(curl -fsSL "$SITE/dists/stable/main/binary-arm64/Packages.xz" | xz -dc | grep -c '^Package:' || true)
            [ "${n:-0}" -eq 0 ] || { echo "stable has $n packages: fresh would empty it"; exit 1; }
          fi
          case "${{ steps.what.outputs.what }}" in
            resign) os/build.sh resign ;;
            *) os/build.sh publish "${{ steps.what.outputs.what }}" ;;
          esac
      # On a build error it carries the live store site over. It fails only
      # when it can't, since deploying without it would delete the Store.
      - name: Store catalog
        env:
          REPO_PREV: ${{ env.SITE }}
          REPO_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: os/build.sh store
      - uses: actions/cache/save@v4
        with:
          path: os/out/pages/apt/pool
          key: apt-pool-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: os/out/pages
      # A stable release keeps stable's pool files as release assets too, so
      # a lost site can be rebuilt with the very bytes devices installed.
      - name: Release assets
        if: steps.what.outputs.what == 'stable' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # os.yml may have made the release first.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Gh0st OS $tag" \
              --notes "Flash the .img.xz (scripts/flash.sh, or bmaptool with the .bmap). Updates come from the stable apt suite: docs/updates.md." ||
            true
          cd os/out/pages/apt
          sed -n 's/^Filename: //p' dists/stable/main/binary-arm64/Packages |
            xargs gh release upload "$tag" --clobber

  # Its own job: in the job that uploaded, the artifact may not be listed
  # yet. Not actions/deploy-pages: it names a deployment after the commit,
  # and Pages keeps the first deployment of a name. A tag on a commit main
  # already deployed, or a weekly re-sign with no new commit, would then
  # change nothing. Here each run gets its own name.
  deploy:
    needs: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=repos/$GITHUB_REPOSITORY
          gh api "$api/actions/runs/$GITHUB_RUN_ID/artifacts" > artifacts.json ||
            { cat artifacts.json; echo "listing the run's artifacts failed"; exit 1; }
          artifact=$(jq -r '.artifacts[] | select(.name == "github-pages") | .id' artifacts.json)
          [ -n "$artifact" ] || { echo "no github-pages artifact"; exit 1; }
          echo "artifact $artifact"
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          # The version must be a commit in the repo: a new commit object
          # with the run's tree, on no branch.
          tree=$(gh api "$api/git/commits/$GITHUB_SHA" --jq .tree.sha)
          version=$(gh api -X POST "$api/git/commits" --jq .sha \
            -f message="Pages, run $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            -f tree="$tree" -f "parents[]=$GITHUB_SHA")
          echo "version $version"
          gh api -X POST "$api/pages/deployments" -F artifact_id="$artifact" \
            -f pages_build_version="$version" -f oidc_token="$oidc" > out.json ||
            { cat out.json; echo "creating the deployment failed"; exit 1; }
          cat out.json
          # As deploy-pages reads it.
          id=$(jq -r '.id // (.status_url // "" | split("/") | last) // empty' out.json)
          id=${id:-$version}
          echo "page_url=$(jq -r '.page_url // empty' out.json)" >> "$GITHUB_OUTPUT"
          for _ in $(seq 120); do
            sleep 5
            status=$(gh api "$api/pages/deployments/$id" --jq .status)
            echo "${status:-(none yet)}"
            case $status in
              succeed) exit 0 ;;
              deployment_in_progress | deployment_queued | "") ;;
              deployment_*) exit 1 ;;
            esac
          done
          echo "timed out"
          exit 1
