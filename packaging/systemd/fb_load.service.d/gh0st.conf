# fb_load draws the boot logo through DRM and, with --keep-open, holds the
# panel until /proc/<pid>/exe is the stock APPLaunch or LaunchWizard binary.
# It never sees gh0st, so the logo would stay over it forever. Without
# --keep-open it draws the logo and lets go. Delete this file to go back.
[Service]
ExecStart=
ExecStart=/usr/sbin/fb_load
